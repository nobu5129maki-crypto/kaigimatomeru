<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="録音や文字起こしを、新聞記事や議事録など指定の長さにまとめて、パソコンで清書できるファイルにするアプリ" />
    <meta name="theme-color" content="#1b2838" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="会議まとめ" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192x192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>会議まとめ</title>
    <script>
      if (location.protocol === 'http:' && /(^|\.)xsrv\.jp$/.test(location.hostname)) {
        location.replace('https://' + location.host + location.pathname + location.search + location.hash)
      }
      window.__installPrompt = null
      window.addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault()
        window.__installPrompt = event
        window.dispatchEvent(new Event('kaigi-install-ready'))
      })
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
